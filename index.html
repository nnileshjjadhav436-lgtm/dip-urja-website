<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    * {

      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.5;
    }

    /* --- Announcement Top Bars --- */
    .top-bar-dark {
      background-color: #0b192c;
      color: #ffffff;
      padding: 6px 30px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
    }

    .top-bar-dark .highlight {
      color: #fbc02d;
    }

    /* --- Navbar Header --- */
    header {
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 30px;
      max-width: 1350px;
      margin: 0 auto;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #0b192c;
      letter-spacing: 0.5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #0284c7;
    }

    /* Action Buttons */
    .btn-complaint {
      background-color: #ea580c;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }

    .btn-complaint:hover {
      background-color: #c2410c;
    }

    .btn-contact {
      background-color: #dc2626;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .btn-contact:hover {
      background-color: #b91c1c;
    }

    .btn-employee {
      border: 1px solid #cbd5e1;
      padding: 7px 14px;
      border-radius: 4px;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .btn-employee:hover {
      background-color: #f1f5f9;
    }

    .hero {
      position: relative;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 40%, #0c4a6e 100%);
      color: #ffffff;
      padding: 80px 30px;
      min-height: 520px;
      display: flex;
      align-items: center;
    }

    .hero-container {
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .hero-content .subtitle {
      font-size: 16px;
      font-weight: 600;
      color: #bae6fd;
      margin-bottom: 8px;
    }

    .hero-content h1 {
      font-size: 44px;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .hero-content h2 {
      font-size: 26px;
      font-weight: 700;
      color: #fde047;
      margin-bottom: 24px;
    }
