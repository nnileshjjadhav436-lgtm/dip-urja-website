<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Attendance System</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 950px;
      width: 100%;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 1.5rem;
      text-align: center;
      color: #111827;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 10px;
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
      background: #fafafa;
    }
    video {
      width: 100%;
      border-radius: 6px;
      background: #000;
      transform: scaleX(-1);
    }
    canvas {
      display: none;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-primary { background-color: #2563eb; color: #fff; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-success { background-color: #16a34a; color: #fff; }
    .btn-success:hover { background-color: #15803d; }
    .btn-neutral { background-color: #4b5563; color: #fff; }
    .btn-neutral:hover { background-color: #374151; }
    
    .status-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      background: #e5e7eb;
      color: #1f2937;
      min-height: 40px;
      white-space: pre-wrap;
    }
    
    .table-container {
      margin-top: 24px;
      border-top: 2px solid #f3f4f6;
      padding-top: 16px;
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .filter-bar input {
      width: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.875rem;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #f9fafb;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #fcfcfc;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Face ID Attendance Portal</h1>

  <div class="grid">
    <div class="card">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="snapshot"></canvas>
      <button class="btn-primary" onclick="startCamera()">Start Camera</button>
    </div>

    <div class="card">
      <h3>Register Student</h3>
      <div class="form-group">
        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" placeholder="e.g. 101">
      </div>
      <div class="form-group">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="e.g. Nilesh Jadhav">
      </div>
      <button class="btn-primary" onclick="registerStudent()">Register Face</button>

      <hr style="margin: 16px 0; border: none; border-top: 1px solid #e5e7eb;">

      <h3>Mark Attendance</h3>
      <button class="btn-success" onclick="markAttendance()">Verify & Log Attendance</button>

      <div class="status-box" id="statusMessage">System ready. Click 'Start Camera' to begin.</div>
    </div>
  </div>

  <!-- Registered Students Section -->
  <div class="table-container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Registered Students</h3>
      <button class="btn-neutral" style="width:auto; padding:6px 14px;" onclick="loadStudents()">Refresh</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Name</th>
        </tr>
      </thead>
      <tbody id="studentsTableBody">
        <tr><td colspan="2" style="text-align:center;">Click Refresh to load list</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Daywise Attendance Section -->
  <div class="table-container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Daywise Attendance Log</h3>
      <button class="btn-neutral" style="width:auto; padding:6px 14px;" onclick="loadAttendance()">Refresh Logs</button>
    </div>
    <div class="filter-bar">
      <label for="filterDate">Filter by Date:</label>
      <input type="date" id="filterDate" onchange="renderFilteredAttendance()">
    </div>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Student ID</th>
          <th>Name</th>
        </tr>
      </thead>
      <tbody id="attendanceTableBody">
        <tr><td colspan="4" style="text-align:center;">Click Refresh Logs to load</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  const BACKEND_URL = "https://customized-treasury-magazines-debug.trycloudflare.com";
  const video = document.getElementById("webcam");
  const canvas = document.getElementById("snapshot");
  const statusMessage = document.getElementById("statusMessage");

  let fullAttendanceLogs = [];

  // Set today's date as default in date filter
  document.getElementById("filterDate").value = new Date().toISOString().split("T")[0];

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      video.srcObject = stream;
      statusMessage.textContent = "Camera connected successfully.";
    } catch (err) {
      statusMessage.textContent = "Camera access denied: " + err.message;
    }
  }

  function captureFrame() {
    if (!video.srcObject) {
      statusMessage.textContent = "Error: Please start the camera first.";
      return null;
    }
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg");
  }

  async function registerStudent() {
    const studentId = document.getElementById("studentId").value.trim();
    const studentName = document.getElementById("studentName").value.trim();
    const imageData = captureFrame();

    if (!studentId || !studentName) {
      statusMessage.textContent = "Error: Student ID and Name are required.";
      return;
    }
    if (!imageData) return;

    statusMessage.textContent = "Registering student...";

    try {
      const res = await fetch(`${BACKEND_URL}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ student_id: studentId, name: studentName, image: imageData })
      });
      const data = await res.json();
      statusMessage.textContent = JSON.stringify(data, null, 2);
      loadStudents();
    } catch (err) {
      statusMessage.textContent = "Connection error: " + err.message;
    }
  }

  async function markAttendance() {
    const imageData = captureFrame();
    if (!imageData) return;

    statusMessage.textContent = "Verifying face...";

    try {
      const res = await fetch(`${BACKEND_URL}/verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageData })
      });
      const data = await res.json();
      statusMessage.textContent = JSON.stringify(data, null, 2);
      loadAttendance();
    } catch (err) {
      statusMessage.textContent = "Connection error: " + err.message;
    }
  }

  async function loadStudents() {
    try {
      const res = await fetch(`${BACKEND_URL}/students`);
      const data = await res.json();
      const tbody = document.getElementById("studentsTableBody");
      tbody.innerHTML = "";

      if (data.students.length === 0) {
        tbody.innerHTML = "<tr><td colspan='2' style='text-align:center;'>No students registered yet.</td></tr>";
        return;
      }

      data.students.forEach(s => {
        const row = `<tr><td>${s.student_id}</td><td>${s.name}</td></tr>`;
        tbody.innerHTML += row;
      });
    } catch (err) {
      console.error(err);
    }
  }

  async function loadAttendance() {
    try {
      const res = await fetch(`${BACKEND_URL}/attendance`);
      const data = await res.json();
      fullAttendanceLogs = data.attendance || [];
      renderFilteredAttendance();
    } catch (err) {
      console.error(err);
    }
  }

  function renderFilteredAttendance() {
    const selectedDate = document.getElementById("filterDate").value;
    const tbody = document.getElementById("attendanceTableBody");
    tbody.innerHTML = "";

    const filtered = selectedDate 
      ? fullAttendanceLogs.filter(log => log.Date === selectedDate)
      : fullAttendanceLogs;

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan='4' style='text-align:center;'>No attendance logged for ${selectedDate || "all dates"}.</td></tr>`;
      return;
    }

    filtered.forEach(log => {
      const row = `<tr>
        <td>${log.Date}</td>
        <td>${log.Time}</td>
        <td>${log.Student_ID}</td>
        <td>${log.Name}</td>
      </tr>`;
      tbody.innerHTML += row;
    });
  }

  // Load records initially
  loadStudents();
  loadAttendance();
</script>

</body>
</html>
