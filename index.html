<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIP URJA POWER SOLUTIONS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f4f7fa;
      color: #222222;
      text-align: center;
      padding-bottom: 20px;
    }

    /* 1. Top Banner Image */
    .top-banner {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: block;
    }

    .top-banner img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 2. Call & WhatsApp Card */
    .cta-card {
      background-color: #1a2a3a;
      color: #ffffff;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px 15px;
      border-radius: 10px;
    }

    .cta-card h2 {
      color: #ffb703;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .cta-card p {
      font-size: 13px;
      color: #e0e0e0;
      margin-bottom: 16px;
    }

    .cta-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-call {
      background-color: #f77f00;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 6px;
      display: inline-block;
    }

    .btn-whatsapp {
      background-color: #25d366;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 6px;
      display: inline-block;
    }

    /* 3. Why Indian Homes Choose Dip Urja (Public.png) */
    .public-banner {
      max-width: 500px;
      margin: 25px auto;
      padding: 0 10px;
    }

    .public-banner img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: block;
    }

    /* 4. Video at Bottom */
    .video-section {
      max-width: 500px;
      margin: 25px auto;
      padding: 0 10px;
    }

    .video-section video {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      display: block;
    }

    /* 5. Instagram Link Button */
    .instagram-section {
      margin: 25px auto 30px auto;
    }

    .instagram-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #c13584;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      padding: 12px 22px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(193, 53, 132, 0.3);
    }

    .instagram-btn img {
      width: 24px;
      height: 24px;
      display: block;
    }

    /* Footer */
    footer {
      border-top: 1px solid #dcdcdc;
      padding-top: 15px;
      font-size: 12px;
      color: #777777;
    }
  </style>
</head>
<body>

  <!-- STEP 1: TOP BANNER IMAGE (DIP URJA POWER SOLUTIONS / D-UPS) -->
  <div class="top-banner">
    <!-- If your uploaded top file has a different name, replace "banner.jpg" with that name -->
    <img src="banner.jpg" alt="Dip Urja Power Solutions - Your Trusted Partner in Solar & Power Solutions">
  </div>

  <!-- STEP 2: READY TO SWITCH TO SOLAR (CALL & WHATSAPP) -->
  <div class="cta-card">
    <h2>Ready to Switch to Solar?</h2>
    <p>Get in touch for a site survey, system capacity assessment, or a free quote.</p>
    <div class="cta-buttons">
      <a href="tel:+919876543210" class="btn-call">📞 Call Now</a>
      <a href="https://wa.me/919876543210" class="btn-whatsapp">💬 WhatsApp</a>
    </div>
  </div>

  <!-- STEP 3: WHY INDIAN HOMES ARE CHOOSING DIP URJA (Public.png) -->
  <div class="public-banner">
    <img src="Public.png" alt="Why Indian Homes Are Choosing Dip Urja Solar">
  </div>

  <!-- STEP 4: VIDEO AT BOTTOM -->
  <div class="video-section">
    <video controls playsinline width="100%">
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- STEP 5: INSTAGRAM BUTTON AT BOTTOM -->
  <div class="instagram-section">
    <a href="https://www.instagram.com/dipurjapower?stkn=MW45dTJ1Z3YwNDlhag==" target="_blank" rel="noopener noreferrer" class="instagram-btn">
      <img src="insta.png" alt="Instagram Icon">
      <span>FOLLOW US ON INSTAGRAM</span>
    </a>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>© Dip Urja Power Solutions. All Rights Reserved.</p>
  </footer>

</body>
</html>
