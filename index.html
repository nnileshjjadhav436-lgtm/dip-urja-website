<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIP URJA - Service, Sales & Project CRM Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* EYE-FRIENDLY DARK SLATE THEME (NO HARSH WHITE GLOW) */
    body {
      background-color: #0b1329;
      color: #f1f5f9;
      line-height: 1.5;
      min-height: 100vh;
    }

    .top-bar {
      background-color: #030712;
      color: #94a3b8;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
    }

    .top-bar .highlight {
      color: #facc15;
      font-weight: 600;
    }

    header {
      background: #0f172a;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #1e293b;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      max-width: 1400px;
      margin: 0 auto;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-complaint { background-color: #ea580c; color: #ffffff; }
    .btn-complaint:hover { background-color: #c2410c; }

    .btn-lead { background-color: #16a34a; color: #ffffff; }
    .btn-lead:hover { background-color: #15803d; }

    .btn-amc-login { background-color: #0284c7; color: #ffffff; }
    .btn-amc-login:hover { background-color: #0369a1; }

    .btn-hr-login { background-color: #4f46e5; color: #ffffff; }
    .btn-hr-login:hover { background-color: #4338ca; }

    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      padding: 22px 20px 18px 20px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    .hero h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #facc15;
    }

    .hero p {
      font-size: 13px;
      color: #94a3b8;
    }
