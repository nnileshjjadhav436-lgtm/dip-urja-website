<script>
  let currentOtp = null;
  let tempPhone = "";
  let tempRole = "";

  function openEmployeeLogin() {
    resetLoginForm();
    document.getElementById('employeeModal').style.display = 'flex';
  }

  function closeEmployeeLogin() {
    document.getElementById('employeeModal').style.display = 'none';
  }

  function resetLoginForm() {
    document.getElementById('stepPhone').style.display = 'block';
    document.getElementById('stepOtp').style.display = 'none';
    document.getElementById('stepDashboard').style.display = 'none';
    document.getElementById('loginStatus').innerText = '';
    document.getElementById('otpCode').value = '';
    currentOtp = null;
  }

  // Generates and sends OTP instantly
  function sendOtp() {
    const phoneInput = document.getElementById('empPhone').value.trim();
    const statusBox = document.getElementById('loginStatus');

    if (!phoneInput || phoneInput.length < 10) {
      statusBox.style.color = '#dc2626';
      statusBox.innerText = 'Please enter a valid mobile number.';
      return;
    }

    // Generate random 6-digit OTP
    currentOtp = Math.floor(100000 + Math.random() * 900000).toString();
    tempPhone = phoneInput;
    tempRole = document.getElementById('empRole').value;

    statusBox.style.color = '#0b2545';
    statusBox.innerText = 'Sending OTP...';

    setTimeout(() => {
      // Switches to OTP step
      document.getElementById('stepPhone').style.display = 'none';
      document.getElementById('stepOtp').style.display = 'block';
      statusBox.innerText = '';

      // Displays the OTP via popup alert for instant entry
      alert("🔐 Verification Code for " + tempPhone + ": " + currentOtp);
    }, 600);
  }

  // Verifies the code and opens dashboard
  function verifyOtp() {
    const enteredOtp = document.getElementById('otpCode').value.trim();

    if (enteredOtp !== currentOtp) {
      alert('Invalid OTP. Please check the code and try again.');
      return;
    }

    renderRoleDashboard(tempRole, tempPhone);
  }

  function renderRoleDashboard(role, phone) {
    document.getElementById('stepOtp').style.display = 'none';
    document.getElementById('stepDashboard').style.display = 'block';

    const title = document.getElementById('portalTitle');
    const badge = document.getElementById('roleBadge');
    const welcome = document.getElementById('welcomeMsg');
    const content = document.getElementById('roleDashboardContent');

    welcome.innerText = 'Logged in: ' + phone;

    if (role === 'md') {
      title.innerText = 'Managing Director Portal';
      badge.innerText = 'EXECUTIVE DESK';
      badge.style.backgroundColor = '#fef3c7';
      badge.style.color = '#b45309';
      content.innerHTML = `
        <strong>Company Performance & Control:</strong><br>
        • Overall Sales & Site Revenue Reports<br>
        • Department Approvals (Solar & Lift UPS projects)<br>
        • Branch & Operational KPIs
      `;
    } else if (role === 'accounts') {
      title.innerText = 'Accounts Department';
      badge.innerText = 'FINANCE & BILLING';
      badge.style.backgroundColor = '#ecfdf5';
      badge.style.color = '#047857';
      content.innerHTML = `
        <strong>Accounting & Invoicing:</strong><br>
        • Customer Subsidy Claims & Bank Disbursement<br>
        • Vendor Purchase Orders & GST Invoicing<br>
        • Customer EMI Settlement Records
      `;
    } else if (role === 'admin_hr') {
      title.innerText = 'Admin / HR Portal';
      badge.innerText = 'ADMINISTRATION';
      badge.style.backgroundColor = '#ede9fe';
      badge.style.color = '#6d28d9';
      content.innerHTML = `
        <strong>Employee Management:</strong><br>
        • Technician & Engineer Attendance Logs<br>
        • Service Ticket Allocations & Stock Requisitions<br>
        • Staff Payroll & Safety Certifications
      `;
    }
  }

  function logoutEmployee() {
    resetLoginForm();
    closeEmployeeLogin();
  }
</script>
